name: Publish

# Publishes every package this repository ships — five to nuget.org and two to
# npm — from one tag, in lockstep.
# See docs/versioning.md: equal versions are conformant, so the two registries
# must not drift.
#
# Both registries use Trusted Publishing (OIDC) — no API key or token is stored
# anywhere. The workflow requests a short-lived GitHub OIDC token, the registry
# validates it against the trusted publishing policy registered for this
# repository, and hands back credentials good for one publish.
#
# Both policies are bound to THIS FILE BY NAME (publish.yml). Renaming or moving
# this file breaks publishing until both are updated.
#
# Setup, once, on nuget.org → username → Trusted Publishing:
#   Repository Owner: erikhuis
#   Repository:       platen-reports
#   Workflow File:    publish.yml
#   Environment:      (leave empty — this workflow uses none)
# Plus a NUGET_USER secret holding the nuget.org username (profile name, not
# the email address).
#
# Setup, once per npm package. npm will not bind a trusted publisher to a
# package that does not exist yet, so each one needs a single hand publish
# first — that is what @platen-reports/designer@0.0.0 was for. Any new npm
# package added to this workflow needs the same two steps before its first
# release, or the run dies at its publish having already pushed the ones
# before it.
# The binding is Package → Settings → Trusted Publisher → GitHub Actions:
#   Organization or user: erikhuis
#   Repository:           platen-reports
#   Workflow filename:    publish.yml
#   Environment:          (leave empty)
# If that binding is missing, or names a different workflow file, the npm step
# fails on a 4xx. Nothing will have reached nuget.org at that point — npm
# publishes first for exactly this reason — so the fix is to bind it and cut a
# new tag.
#
# Cutting a release (see docs/versioning.md):
#   0. 0.0.0 is already taken on both registries by the id-reserving
#      placeholders, so the first release driven from here is 0.1.0 or later.
#   1. Bump <VersionPrefix> in Directory.Build.props and commit it. That file
#      stays the only place a version is written.
#   2. Tag that commit vX.Y.Z, or vX.Y.Z-alpha.N for a prerelease.
#   3. Push the tag. This workflow refuses to run on anything but a v* tag, and
#      refuses to publish if the tag and Directory.Build.props disagree.
# workflow_dispatch re-runs a release that failed before the push — pick the
# tag, not a branch, in the ref dropdown. A release that failed part way
# *through* the push cannot be retried: nuget.org does not allow a version to
# be replaced. Cut a new patch tag instead.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: pack · push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for GitHub to issue the OIDC token

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink needs the history

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Deliberately no registry-url. It reads like the right thing to set, and
      # it breaks trusted publishing: setup-node responds by writing an .npmrc
      # containing _authToken=${NODE_AUTH_TOKEN}, and with no token secret in
      # play NODE_AUTH_TOKEN becomes the literal placeholder XXXXX-XXXXX-XXXXX.
      # npm then authenticates as nobody instead of exchanging its OIDC token,
      # and the registry answers an unauthorised write with 404, not 403 — so
      # the failure reads as "package not found" for a package that plainly
      # exists. registry.npmjs.org is the default registry anyway.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Trusted publishing on npm needs 11.5.1 or newer. Node 24 ships a new
      # enough npm today; upgrading anyway keeps this working when the runner
      # image moves and costs a few seconds on a workflow that runs per release.
      - name: Upgrade npm
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      # The tag names the release; Directory.Build.props writes the version.
      # This step splits the tag, the next one asserts the two agree — a
      # mismatch fails the release rather than publishing a version nobody
      # chose. Without this the pack below would silently use whatever
      # <VersionPrefix> happens to say, tag or no tag.
      - name: Resolve version from tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Publish runs from a v* tag only; this run is on $REF_TYPE '$REF_NAME'."
            exit 1
          fi
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          fi
          version="${REF_NAME#v}"
          prefix="${version%%-*}"
          suffix="${version#"$prefix"}"   # '' or '-alpha.1'
          suffix="${suffix#-}"            # VersionSuffix carries no leading dash
          # npm has no notion of "prerelease" in its resolution — whatever
          # dist-tag you publish under is what `npm install <pkg>` gets, and it
          # defaults to latest. NuGet excludes prereleases on its own; npm has
          # to be told. So alpha.1 publishes under the alpha tag, leaving
          # latest pointing at the newest stable.
          if [ -n "$suffix" ]; then
            npm_tag="${suffix%%.*}"
          else
            npm_tag="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          # Exported, not passed per-command: restore, build, test and pack must
          # all see the same version, or the assembly inside the package
          # disagrees with the package. Directory.Build.props only defaults
          # VersionSuffix when it is empty, so this wins.
          echo "VersionSuffix=$suffix" >> "$GITHUB_ENV"
          echo "Releasing $version (prefix $prefix, suffix ${suffix:-none}, npm tag $npm_tag)."

      - name: Check tag against Directory.Build.props
        env:
          TAG_PREFIX: ${{ steps.version.outputs.prefix }}
        run: |
          set -euo pipefail
          props=$(dotnet msbuild src/PlatenReports.Core/PlatenReports.Core.csproj \
                    -getProperty:VersionPrefix | tr -d '[:space:]')
          if [ "$props" != "$TAG_PREFIX" ]; then
            echo "::error::Tag v$TAG_PREFIX disagrees with <VersionPrefix>$props</VersionPrefix> in Directory.Build.props. Bump the props file, commit, and re-tag."
            exit 1
          fi
          echo "Tag and Directory.Build.props agree on $props."

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Never publish something that has not been tested.
      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts

      - uses: pnpm/action-setup@v4

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # `files` in packages/model/package.json ships dist/, which is gitignored —
      # so packing without building first produces a package whose entry points
      # resolve to nothing. The designer has no build yet (still a placeholder);
      # --if-present covers both without special-casing either.
      - name: Build packages
        run: pnpm -r --filter './packages/**' build --if-present

      # The npm packages carry no version of their own — docs/versioning.md makes
      # Directory.Build.props the only place a version is written, so the 0.0.0
      # sitting in each package.json is a placeholder overwritten here. The
      # rewrite is never committed; the runner is thrown away.
      - name: Pack npm packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for pkg in model designer; do
            (
              cd "packages/$pkg"
              npm version "$VERSION" --no-git-tag-version --allow-same-version
              npm pack --pack-destination ../../artifacts
            )
          done

      # Everything is packed and nothing is published yet: this is the last
      # point at which a wrong version costs nothing. Both registries are
      # checked together, because a release that is right on one and wrong on
      # the other breaks the lockstep guarantee in docs/versioning.md.
      - name: Verify packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l artifacts
          missing=0
          # Every package this repo publishes. This list was written when the repo
          # had four and silently stayed at four while the carve added more — so a
          # missing package passed verification. Add to it when a package is added.
          for f in "PlatenReports.Abstractions.$VERSION.nupkg" \
                   "PlatenReports.Core.$VERSION.nupkg" \
                   "PlatenReports.NCalc.$VERSION.nupkg" \
                   "PlatenReports.Sql.$VERSION.nupkg" \
                   "PlatenReports.Pdf.$VERSION.nupkg" \
                   "platen-reports-model-$VERSION.tgz" \
                   "platen-reports-designer-$VERSION.tgz"; do
            if [ ! -f "artifacts/$f" ]; then
              echo "::error::artifacts/$f was not produced; refusing to publish."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # npm goes first of the two publishes. Neither registry can be rolled
      # back, so a split release is possible either way; putting the more
      # failure-prone half first means its failure aborts the run before
      # anything reaches nuget.org. npm is the more failure-prone half — the
      # scope, the package and its trusted publisher all have to exist.
      #
      # Publishing the tarball rather than the directory ships exactly the bits
      # the verify step looked at, matching how the NuGet half works.
      - name: Publish npm packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: |
          set -euo pipefail
          # --loglevel verbose is not noise here, it is the only way to see why
          # a trusted-publishing failure happened. npm's OIDC helper is written
          # never to throw: every failure — missing id-token permission, a bad
          # token fetch, a rejected exchange — is logged at verbose and then
          # swallowed, after which publish reports a bare ENEEDAUTH with no
          # reason attached. At verbose the "oidc" lines carry the registry's
          # actual message.
          #
          # The ./ is load-bearing: npm reads a bare a/b argument as the GitHub
          # shorthand owner/repo and tries to clone it.
          #
          # model first: the designer depends on it, so a run that dies between
          # the two leaves a resolvable model without a designer rather than a
          # designer that cannot resolve its dependency.
          for pkg in model designer; do
            npm publish "./artifacts/platen-reports-$pkg-$VERSION.tgz" \
              --provenance \
              --tag "$NPM_TAG" \
              --loglevel verbose
          done

      # Request the short-lived key as late as possible: it expires after an
      # hour, and each OIDC token buys exactly one key.
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Deliberately no --skip-duplicate. A version already on nuget.org is a
      # mistake worth failing on — either the tag was reused, or the release
      # already went out. Both should be loud, and a release that publishes
      # nothing must not report success.
      #
      # The cost is that re-running after a partial push fails on the packages
      # that did make it up. That is the intended trade: nuget.org will not let
      # a version be replaced anyway, so the fix is a new patch tag, not a retry.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
