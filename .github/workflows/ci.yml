name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build · test · pack
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so SourceLink can resolve commit metadata.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Produces .nupkg + .snupkg. Determinism, SourceLink and symbol settings
      # come from Directory.Build.props; ContinuousIntegrationBuild switches
      # itself on here via the GITHUB_ACTIONS environment variable.
      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  npm:
    name: npm build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --filter './packages/**' typecheck

      # Build before test: the packaging guard asserts against dist/, so a stale or missing
      # bundle would make it vacuous rather than failing.
      - name: Build
        run: pnpm -r --filter './packages/**' build

      - name: Test
        run: pnpm -r --filter './packages/**' test
